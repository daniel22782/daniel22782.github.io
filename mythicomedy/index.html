<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mythic Comedy Order</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./styles.css" />

</head>

<body>
  <div class="container">
    <h1>Mythic Comedy Order</h1>
    <p>Frog → Dog → Cow → Sky‑Jester Bird</p>

    <div class="input-row">
      <input id="mc-prompt" type="text" placeholder="Enter your prompt..." />
      <button id="mc-submit">Summon Comedy</button>
    </div>

    <div class="panels">
      <div id="mc-panel1" class="panel frog"></div>
      <div id="mc-panel2" class="panel dog"></div>
      <div id="mc-panel3" class="panel cow"></div>
      <div id="mc-panel4" class="panel bird"></div>
    </div>
  </div>

  <script src="./mythicomedy.js"></script>
</body>
</html>
